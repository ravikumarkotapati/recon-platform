server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: recon-consumer-app
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

aws:
  secrets:
    enabled: ${AWS_SECRETS_ENABLED}
    region: ${AWS_REGION}
    name: ${AWS_SECRET_NAME}

ibm:
  mq:
    queue-manager: ${MQ_QMGR}
    channel: ${MQ_CHANNEL}
    conn-name: ${MQ_CONN_NAME}
    user: ${MQ_USER}
    password: ${MQ_PASSWORD}

recon:
  input-queue: ${RECON_INPUT_QUEUE}
  retry-queue: ${RECON_RETRY_QUEUE}
  backout-queue: ${RECON_BACKOUT_QUEUE}
  dead-letter-queue: ${RECON_DLQ}
  replay-queue: ${RECON_REPLAY_QUEUE}
  listener-concurrency: ${CONSUMER_CONCURRENCY}
  listener-max-concurrency: ${CONSUMER_MAX_CONCURRENCY}
  db-deadlock-retry-attempts: ${DB_DEADLOCK_RETRY_ATTEMPTS}
  db-slow-threshold-ms: ${DB_SLOW_THRESHOLD_MS}

management:
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://jaeger-collector.observability.svc.cluster.local:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      databaseCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${DB_CIRCUIT_BREAKER_WINDOW_SIZE}
        minimumNumberOfCalls: ${DB_CIRCUIT_BREAKER_MIN_CALLS}
        failureRateThreshold: ${DB_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD}
        waitDurationInOpenState: ${DB_CIRCUIT_BREAKER_OPEN_WAIT}
  bulkhead:
    instances:
      databaseBulkhead:
        maxConcurrentCalls: ${DB_BULKHEAD_MAX_CONCURRENT_CALLS}
        maxWaitDuration: ${DB_BULKHEAD_MAX_WAIT}
