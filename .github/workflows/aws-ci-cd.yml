name: Build and Deploy to AWS EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "860510876120"
  EKS_CLUSTER_NAME: recon-eks
  K8S_NAMESPACE: recon-platform

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test producer
        run: mvn -B -f recon-producer-app/pom.xml verify

      - name: Test consumer
        run: mvn -B -f recon-consumer-app/pom.xml verify

      - name: Test dashboard API
        run: mvn -B -f recon-dashboard-api/pom.xml verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        shell: bash
        run: |
          for repo in recon-producer-app recon-consumer-app recon-dashboard-api; do
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "$repo" >/dev/null
          done

      - name: Build and push images
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA::12}"
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          docker build -t "$REGISTRY/recon-producer-app:$IMAGE_TAG" recon-producer-app
          docker build -t "$REGISTRY/recon-consumer-app:$IMAGE_TAG" recon-consumer-app
          docker build -t "$REGISTRY/recon-dashboard-api:$IMAGE_TAG" recon-dashboard-api

          docker push "$REGISTRY/recon-producer-app:$IMAGE_TAG"
          docker push "$REGISTRY/recon-consumer-app:$IMAGE_TAG"
          docker push "$REGISTRY/recon-dashboard-api:$IMAGE_TAG"

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Apply Kubernetes manifests
        run: kubectl apply -k aws-kubernetes/manifests

      - name: Deploy new images
        shell: bash
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/recon-producer-app producer="$REGISTRY/recon-producer-app:$IMAGE_TAG"
          kubectl -n "$K8S_NAMESPACE" set image deployment/recon-consumer-app consumer="$REGISTRY/recon-consumer-app:$IMAGE_TAG"
          kubectl -n "$K8S_NAMESPACE" set image deployment/recon-dashboard-api dashboard-api="$REGISTRY/recon-dashboard-api:$IMAGE_TAG"

      - name: Verify rollouts
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/recon-producer-app --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/recon-consumer-app --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/recon-dashboard-api --timeout=180s
