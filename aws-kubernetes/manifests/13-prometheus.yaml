apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/recon-alerts.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: observability
data:
  recon-alerts.yml: |
    groups:
      - name: reconciliation-platform
        rules:
          - alert: ReconAppDown
            expr: up{namespace="recon-platform"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Reconciliation app scrape is down"
              description: "Prometheus cannot scrape {{ $labels.app }} pod {{ $labels.pod }}."

          - alert: ReconRetryQueueBacklog
            expr: mq_queue_depth{queue="RECON.RETRY"} > 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Retry queue backlog is growing"
              description: "RECON.RETRY depth is {{ $value }} for more than five minutes."

          - alert: ReconBackoutQueueNotEmpty
            expr: mq_queue_depth{queue="RECON.BACKOUT"} > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Backout queue contains messages"
              description: "Poison or exhausted-retry messages are present in RECON.BACKOUT."

          - alert: ReconDeadLetterQueueNotEmpty
            expr: mq_queue_depth{queue="SYSTEM.DEAD.LETTER.QUEUE"} > 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Dead-letter queue contains messages"
              description: "SYSTEM.DEAD.LETTER.QUEUE is not empty and requires inspection."

          - alert: ReconDeadlockRetriesHigh
            expr: increase(recon_db_deadlock_retries_total[5m]) > 5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Database deadlock retries are high"
              description: "Deadlock retry count increased by {{ $value }} in five minutes."

          - alert: ReconHighConsumerErrorRate
            expr: |
              (
                rate(recon_consumer_processing_failures_total[5m])
                /
                clamp_min(rate(recon_consumer_messages_total[5m]), 1)
              ) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Consumer error rate above 5%"
              description: "Consumer processing failure ratio has exceeded 5%."

          - alert: ReconQueueDepthUnavailable
            expr: mq_queue_depth < 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Queue depth metric unavailable"
              description: "Queue depth browser failed for {{ $labels.queue }}."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules/recon-alerts.yml
              subPath: recon-alerts.yml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-alert-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
