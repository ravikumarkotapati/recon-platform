apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger-query.observability.svc.cluster.local:16686
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: reconciliation
        orgId: 1
        folder: Reconciliation
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-recon-dashboard
  namespace: observability
data:
  reconciliation-platform.json: |
    {
      "uid": "recon-platform",
      "title": "Reconciliation Platform SRE",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "tags": ["reconciliation", "ibm-mq", "sre"],
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Producer TPS",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(rate(recon_producer_messages_total[1m]))", "legendFormat": "TPS"}],
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Consumer TPS",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(rate(recon_consumer_messages_total[1m]))", "legendFormat": "TPS"}],
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Consumer Error Rate",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(rate(recon_consumer_processing_failures_total[5m])) / clamp_min(sum(rate(recon_consumer_messages_total[5m])), 1)", "legendFormat": "error-rate"}],
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Deadlock Retries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(increase(recon_db_deadlock_retries_total[5m]))", "legendFormat": "deadlocks"}],
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "MQ Queue Depth",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "mq_queue_depth", "legendFormat": "{{queue}}"}],
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Retry and Backout Messages",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "sum(increase(recon_retry_messages_total[5m]))", "legendFormat": "retry"},
            {"expr": "sum(increase(recon_backout_messages_total[5m]))", "legendFormat": "backout"},
            {"expr": "sum(increase(recon_dead_letter_messages_total[5m]))", "legendFormat": "dead-letter"}
          ],
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Application Availability",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "up{namespace=\"recon-platform\"}", "legendFormat": "{{app}}/{{pod}}"}],
          "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8}
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "HTTP Server Request Latency p95",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, app, uri))", "legendFormat": "{{app}} {{uri}}"}],
          "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8}
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-password
            - name: GF_USERS_DEFAULT_THEME
              value: light
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yml
              subPath: datasources.yml
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/reconciliation-platform.json
              subPath: reconciliation-platform.json
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard
          configMap:
            name: grafana-recon-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - name: http
      port: 80
      targetPort: 3000
