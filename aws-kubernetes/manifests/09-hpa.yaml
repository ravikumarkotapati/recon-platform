apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recon-producer-app
  namespace: recon-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recon-producer-app
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recon-consumer-app
  namespace: recon-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recon-consumer-app
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recon-dashboard-api
  namespace: recon-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recon-dashboard-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
