apiVersion: v1
kind: ConfigMap
metadata:
  name: recon-runtime-config
  namespace: recon-platform
data:
  AWS_SECRETS_ENABLED: "true"
  AWS_REGION: "ap-southeast-1"
  AWS_SECRET_NAME: "recon/prod/app"
  AWS_SECRETS_NAME: "recon/prod/app"
  AWS_SECRETS_REGION: "ap-southeast-1"

  MQ_QMGR: "QM1"
  MQ_CHANNEL: "DEV.APP.SVRCONN"
  MQ_CONN_NAME: "ibm-mq.recon-platform.svc.cluster.local(1414)"

  RECON_INPUT_QUEUE: "RECON.IN"
  RECON_RETRY_QUEUE: "RECON.RETRY"
  RECON_BACKOUT_QUEUE: "RECON.BACKOUT"
  RECON_DLQ: "SYSTEM.DEAD.LETTER.QUEUE"
  RECON_REPLAY_QUEUE: "RECON.REPLAY"
  TRACING_ENABLED: "true"
  OTEL_TRACES_SAMPLER_PROBABILITY: "1.0"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://jaeger-collector.observability.svc.cluster.local:4318/v1/traces"

  PRODUCER_TPS: "25"
  PRODUCER_INTERVAL_MS: "1000"
  INVALID_PERCENT: "5"
  MESSAGE_SOURCE: "recon-producer-eks"

  CONSUMER_CONCURRENCY: "2"
  CONSUMER_MAX_CONCURRENCY: "8"
  DB_DEADLOCK_RETRY_ATTEMPTS: "3"
  DB_SLOW_THRESHOLD_MS: "500"

  DB_CIRCUIT_BREAKER_WINDOW_SIZE: "20"
  DB_CIRCUIT_BREAKER_MIN_CALLS: "10"
  DB_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD: "50"
  DB_CIRCUIT_BREAKER_OPEN_WAIT: "30s"
  DB_BULKHEAD_MAX_CONCURRENT_CALLS: "20"
  DB_BULKHEAD_MAX_WAIT: "250ms"
