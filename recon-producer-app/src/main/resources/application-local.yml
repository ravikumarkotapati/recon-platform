aws:
  secrets:
    enabled: false
    region: ap-southeast-1
    name: local-disabled

ibm:
  mq:
    queue-manager: QM1
    channel: DEV.APP.SVRCONN
    conn-name: localhost(1414)
    user: app
    password: change-me-local-mq-password

recon:
  input-queue: RECON.IN
  producer-tps: 5
  producer-interval-ms: 1000
  invalid-percent: 10
  message-source: recon-producer-local

management:
  health:
    jms:
      enabled: false
